name: AFK Bot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-js: '18'
      
      - name: Install mineflayer
        run: npm install mineflayer@latest
        
      - name: Run AFK bot
        run: |
          node -e "
          const mineflayer = require('mineflayer');
          
          const bot = mineflayer.createBot({
            host: '${{ secrets.SERVER_IP }}',
            port: 25565,
            username: '${{ secrets.BOT_USERNAME }}',
            version: '1.20.4',
            auth: 'offline',
            checkTimeoutInterval: 300000,
            logErrors: true
          });
          
          // COMPLETE KEEPALIVE OVERRIDE
          bot.once('login', () => {
            // Remove all existing keepalive handlers
            bot._client.removeAllListeners('keep_alive');
            
            // Add our own handler
            bot._client.on('keep_alive', (packet) => {
              // Send the EXACT same ID back
              bot._client.write('keep_alive', {
                keepAliveId: packet.keepAliveId
              });
              console.log('💓 Keepalive responded:', packet.keepAliveId);
            });
          });
          
          // Disable mineflayer's internal keepalive timer
          bot.once('spawn', () => {
            if (bot._client.keepAlive) {
              clearInterval(bot._client.keepAlive);
              bot._client.keepAlive = null;
            }
            console.log('✅ Bot spawned! Internal keepalive disabled.');
          });
          
          bot.on('spawn', () => {
            console.log('✅ Bot active!');
            
            setInterval(() => {
              bot.setControlState('jump', true);
              setTimeout(() => bot.setControlState('jump', false), 200);
              bot.look(Math.random() * Math.PI * 2, 0);
            }, 5000);
          });
          
          bot.on('end', (reason) => {
            console.log('❌ Disconnected:', reason);
          });
          
          bot.on('error', (err) => {
            console.log('Error:', err.message);
          });
          
          setTimeout(() => {
            console.log('⏰ Shutting down...');
            process.exit(0);
          }, 570000);
          "
