name: AFK Bot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check Iran time (12:00-23:00)
        run: |
          IRAN_HOUR=$(TZ='Asia/Tehran' date +%H)
          echo "Current Iran hour: $IRAN_HOUR"
          if [ $IRAN_HOUR -lt 12 ] || [ $IRAN_HOUR -ge 23 ]; then
            echo "⏰ Outside hours. Exiting."
            exit 0
          fi
          RANDOM_DELAY=$((RANDOM % 300))
          echo "⏳ Adding ${RANDOM_DELAY}s random delay..."
          sleep $RANDOM_DELAY
          echo "✅ Within hours. Running bot."
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-js: '18'
      
      - name: Install mineflayer
        run: npm install mineflayer@latest
        
      - name: Run AFK bot
        run: |
          node -e "
          const mineflayer = require('mineflayer');
          
          // === GENERATE BTT + RANDOM NUMBER ===
          const randomNum = Math.floor(Math.random() * 9999) + 1;
          const botName = 'BTT' + randomNum;
          console.log('🎭 Bot name:', botName);
          
          // === RANDOM SESSION PARAMETERS ===
          const sessionMs = 120000 + Math.floor(Math.random() * 720000);
          const disconnectCount = 1 + Math.floor(Math.random() * 3);
          console.log('⏳ Session:', Math.round(sessionMs/60000), 'min,', disconnectCount, 'disconnects');
          
          let bot = null;
          let active = true;
          let reconnectTimer = null;
          let isDisconnecting = false;
          
          function createBot() {
            if (!active) return;
            
            console.log('🔄 Connecting as', botName, '...');
            
            bot = mineflayer.createBot({
              host: '${{ secrets.SERVER_IP }}',
              port: 25565,
              username: botName,  // ← FIXED: uses random name, not secret
              version: '1.20.4',
              auth: 'offline',
              checkTimeoutInterval: 300000,
              logErrors: true
            });
            
            bot.once('login', () => {
              bot._client.removeAllListeners('keep_alive');
              bot._client.on('keep_alive', (packet) => {
                bot._client.write('keep_alive', {
                  keepAliveId: packet.keepAliveId
                });
              });
            });
            
            bot.once('spawn', () => {
              if (bot && bot._client && bot._client.keepAlive) {
                clearInterval(bot._client.keepAlive);
                bot._client.keepAlive = null;
              }
              console.log('✅', botName, 'spawned!');
            });
            
            bot.on('spawn', () => {
              console.log('✅', botName, 'active!');
              
              let moveInterval = setInterval(() => {
                if (!active || !bot || isDisconnecting) return;
                
                const action = Math.random();
                
                if (action < 0.15) {
                  return; // Human pause
                } else if (action < 0.30) {
                  bot.setControlState('jump', true);
                  setTimeout(() => {
                    if (bot) bot.setControlState('jump', false);
                  }, 150 + Math.random() * 350);
                } else if (action < 0.45) {
                  bot.setControlState('forward', true);
                  setTimeout(() => {
                    if (bot) bot.setControlState('forward', false);
                  }, 800 + Math.random() * 2500);
                } else if (action < 0.55) {
                  bot.setControlState('back', true);
                  setTimeout(() => {
                    if (bot) bot.setControlState('back', false);
                  }, 800 + Math.random() * 2000);
                } else if (action < 0.65) {
                  bot.setControlState('sneak', true);
                  setTimeout(() => {
                    if (bot) bot.setControlState('sneak', false);
                  }, 1200 + Math.random() * 2000);
                } else if (action < 0.75) {
                  if (Math.random() > 0.5) {
                    bot.setControlState('left', true);
                    setTimeout(() => {
                      if (bot) bot.setControlState('left', false);
                    }, 400 + Math.random() * 1200);
                  } else {
                    bot.setControlState('right', true);
                    setTimeout(() => {
                      if (bot) bot.setControlState('right', false);
                    }, 400 + Math.random() * 1200);
                  }
                } else {
                  bot.look(
                    Math.random() * Math.PI * 2,
                    (Math.random() - 0.5) * 0.6
                  );
                }
              }, 4000 + Math.random() * 8000);
              
              bot._moveInterval = moveInterval;
            });
            
            bot.on('end', (reason) => {
              console.log('❌', botName, 'disconnected:', reason);
              if (bot && bot._moveInterval) {
                clearInterval(bot._moveInterval);
                bot._moveInterval = null;
              }
              if (active && !reconnectTimer) {
                const delay = 5000 + Math.random() * 60000;
                console.log('🔄 Reconnecting in', Math.round(delay/1000), 's...');
                reconnectTimer = setTimeout(() => {
                  reconnectTimer = null;
                  if (active) createBot();
                }, delay);
              }
            });
            
            bot.on('error', (err) => {
              if (err.message.includes('ECONNREFUSED')) {
                console.log('⚠️ Server offline, will retry...');
              } else {
                console.log('Error:', err.message);
              }
            });
          }
          
          createBot();
          
          let disconnectionsDone = 0;
          
          function scheduleRandomDisconnect() {
            if (!active || disconnectionsDone >= disconnectCount) return;
            
            const waitMs = 120000 + Math.floor(Math.random() * 720000);
            console.log('⏳ Next random disconnect in', Math.round(waitMs/60000), 'min');
            
            setTimeout(() => {
              if (!active || !bot || disconnectionsDone >= disconnectCount || isDisconnecting) return;
              
              if (Math.random() < 0.75) {
                disconnectionsDone++;
                isDisconnecting = true;
                console.log('🔌 Random disconnect (', disconnectionsDone, '/', disconnectCount, ')');
                
                if (bot) {
                  bot.end();
                  bot = null;
                }
                
                const reconnectDelay = 8000 + Math.random() * 52000;
                console.log('🔄 Reconnecting in', Math.round(reconnectDelay/1000), 's...');
                setTimeout(() => {
                  isDisconnecting = false;
                  if (active) createBot();
                }, reconnectDelay);
              } else {
                console.log('⏭️ Skipped random disconnect.');
              }
              
              scheduleRandomDisconnect();
              
            }, waitMs);
          }
          
          scheduleRandomDisconnect();
          
          setTimeout(() => {
            console.log('⏰ Session ending. Shutting down...');
            active = false;
            if (bot) {
              bot.end();
              bot = null;
            }
            if (reconnectTimer) {
              clearTimeout(reconnectTimer);
              reconnectTimer = null;
            }
            process.exit(0);
          }, sessionMs);
          "
