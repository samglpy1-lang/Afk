name: AFK Bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    concurrency:
      group: afk-bot
      cancel-in-progress: true
    
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-js: '18'
      
      - name: Install mineflayer
        run: npm install mineflayer@latest
        
      - name: Run AFK bot
        run: |
          node -e "
          const mineflayer = require('mineflayer');
          const https = require('https');
          const url = require('url');
          
          // === CONFIGURATION ===
          const VERSIONS = ['1.20.4', '1.20.2', '1.19.4', '1.19.2', '1.18.2'];
          const SESSION_MIN = 120000;   // 2 minutes
          const SESSION_MAX = 840000;   // 14 minutes
          const TIMEOUT = 60000;        // 1 minute
          const RECONNECT_MIN = 5000;   // 5 seconds
          const RECONNECT_MAX = 65000;  // 65 seconds
          
          // === GENERATE UNIQUE BOT NAME ===
          const timestamp = Date.now().toString().slice(-4);
          const randomNum = Math.floor(Math.random() * 9000) + 1000;
          const botName = 'BTT' + timestamp + randomNum;
          console.log('🎭 Bot name:', botName);
          
          // === RANDOM SESSION PARAMETERS ===
          const sessionMs = SESSION_MIN + Math.floor(Math.random() * (SESSION_MAX - SESSION_MIN));
          const disconnectCount = 1 + Math.floor(Math.random() * 3);
          console.log('⏳ Session:', Math.round(sessionMs/60000), 'min,', disconnectCount, 'disconnects');
          
          // === STATE ===
          let bot = null;
          let active = true;
          let spawned = false;
          let reconnectTimer = null;
          let isDisconnecting = false;
          let moveInterval = null;
          let sessionTimer = null;
          let disconnectTimer = null;
          let currentVersion = VERSIONS[0];
          let versionIndex = 0;
          let verificationAttempted = false;
          
          // === VERIFICATION LINK HANDLER ===
          function handleVerificationLink(link) {
            console.log('🔗 Verification link detected:', link);
            
            if (verificationAttempted) {
              console.log('⏭️ Verification already attempted this session.');
              return;
            }
            
            verificationAttempted = true;
            
            try {
              const parsedUrl = url.parse(link);
              console.log('🌐 Sending GET request to verify...');
              
              const req = https.get(link, (res) => {
                console.log('📡 Response status:', res.statusCode);
                console.log('📡 Response headers:', JSON.stringify(res.headers, null, 2));
                
                let data = '';
                res.on('data', (chunk) => { data += chunk; });
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    console.log('✅ Verification request sent successfully!');
                    console.log('📄 Response preview:', data.substring(0, 200));
                  } else if (res.statusCode === 302 || res.statusCode === 301) {
                    console.log('🔄 Redirected. Verification may require browser session.');
                    console.log('📍 Location:', res.headers.location);
                  } else {
                    console.log('⚠️ Unexpected status code:', res.statusCode);
                  }
                });
              });
              
              req.on('error', (err) => {
                console.log('❌ Verification request failed:', err.message);
              });
              
              req.setTimeout(10000, () => {
                req.destroy();
                console.log('⏰ Verification request timed out.');
              });
              
              req.end();
              
            } catch (e) {
              console.log('❌ Error handling verification link:', e.message);
            }
          }
          
          // === CLEANUP FUNCTION ===
          function cleanup() {
            if (moveInterval) {
              clearInterval(moveInterval);
              moveInterval = null;
            }
            if (reconnectTimer) {
              clearTimeout(reconnectTimer);
              reconnectTimer = null;
            }
            if (sessionTimer) {
              clearTimeout(sessionTimer);
              sessionTimer = null;
            }
            if (disconnectTimer) {
              clearTimeout(disconnectTimer);
              disconnectTimer = null;
            }
            if (bot) {
              try { 
                bot.end(); 
                console.log('🧹 Bot cleaned up');
              } catch (e) {}
              bot = null;
            }
            spawned = false;
            isDisconnecting = false;
          }
          
          // === CREATE BOT ===
          function createBot() {
            if (!active) return;
            cleanup();
            
            console.log('🔄 Connecting as', botName, '(version:', currentVersion, ')...');
            spawned = false;
            verificationAttempted = false;
            
            try {
              bot = mineflayer.createBot({
                host: '${{ secrets.SERVER_IP }}',
                port: 25565,
                username: botName,
                version: currentVersion,
                auth: 'offline',
                checkTimeoutInterval: TIMEOUT,
                logErrors: true,
                hideErrors: false
              });
            } catch (e) {
              console.log('❌ Failed to create bot:', e.message);
              scheduleReconnect();
              return;
            }
            
            // === RESOURCE PACK HANDLER ===
            bot.on('resourcePack', () => {
              try {
                bot.denyResourcePack();
                console.log('📦 Resource pack denied.');
              } catch (e) {}
            });
            
            // === KEEPALIVE FIX ===
            bot.once('login', () => {
              try {
                bot._client.removeAllListeners('keep_alive');
                bot._client.on('keep_alive', (packet) => {
                  try {
                    bot._client.write('keep_alive', {
                      keepAliveId: packet.keepAliveId
                    });
                  } catch (e) {}
                });
                console.log('💓 Keepalive handler installed');
              } catch (e) {}
            });
            
            // === DISABLE INTERNAL KEEPALIVE ===
            bot.once('spawn', () => {
              spawned = true;
              try {
                if (bot && bot._client && bot._client.keepAlive) {
                  clearInterval(bot._client.keepAlive);
                  bot._client.keepAlive = null;
                }
              } catch (e) {}
              console.log('✅', botName, 'spawned!');
            });
            
            // === MOVEMENT LOGIC ===
            bot.on('spawn', () => {
              console.log('✅', botName, 'active!');
              
              if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
              }
              
              moveInterval = setInterval(() => {
                if (!active || !bot || isDisconnecting || !spawned) return;
                if (!bot.entity || !bot.entity.id || !bot.entity.position) return;
                
                try {
                  const action = Math.random();
                  
                  if (action < 0.15) {
                    return;
                  } else if (action < 0.30) {
                    bot.setControlState('jump', true);
                    setTimeout(() => {
                      if (bot && spawned) bot.setControlState('jump', false);
                    }, 150 + Math.random() * 350);
                  } else if (action < 0.45) {
                    bot.setControlState('forward', true);
                    setTimeout(() => {
                      if (bot && spawned) bot.setControlState('forward', false);
                    }, 800 + Math.random() * 2500);
                  } else if (action < 0.55) {
                    bot.setControlState('back', true);
                    setTimeout(() => {
                      if (bot && spawned) bot.setControlState('back', false);
                    }, 800 + Math.random() * 2000);
                  } else if (action < 0.65) {
                    bot.setControlState('sneak', true);
                    setTimeout(() => {
                      if (bot && spawned) bot.setControlState('sneak', false);
                    }, 1200 + Math.random() * 2000);
                  } else if (action < 0.75) {
                    if (Math.random() > 0.5) {
                      bot.setControlState('left', true);
                      setTimeout(() => {
                        if (bot && spawned) bot.setControlState('left', false);
                      }, 400 + Math.random() * 1200);
                    } else {
                      bot.setControlState('right', true);
                      setTimeout(() => {
                        if (bot && spawned) bot.setControlState('right', false);
                      }, 400 + Math.random() * 1200);
                    }
                  } else {
                    bot.look(
                      Math.random() * Math.PI * 2,
                      (Math.random() - 0.5) * 0.6
                    );
                  }
                } catch (e) {}
              }, 4000 + Math.random() * 8000);
            });
            
            // === CHAT MESSAGE HANDLER (Verification Detection) ===
            bot.on('messagestr', (message) => {
              try {
                // Regex to detect FalixNodes verification message
                // Matches: "X min left to verify! https://client.falixnodes.net/verify?t=CODE"
                const verifyRegex = /(\d+)\s+min\s+left\s+to\s+verify!\s+(https:\/\/client\.falixnodes\.net\/verify\?t=[A-Z0-9]+)/i;
                const match = message.match(verifyRegex);
                
                if (match) {
                  const minutesLeft = match[1];
                  const verifyUrl = match[2];
                  console.log(`⚠️ Verification required in ${minutesLeft} minutes!`);
                  console.log(`🔗 Link detected: ${verifyUrl}`);
                  
                  // Attempt to handle the verification link
                  handleVerificationLink(verifyUrl);
                }
                
                // Also detect "Click to verify" messages with click events
                if (message.includes('Click to verify') && message.includes('client.falixnodes.net/verify')) {
                  const urlMatch = message.match(/https:\/\/client\.falixnodes\.net\/verify\?t=[A-Z0-9]+/i);
                  if (urlMatch) {
                    console.log('🔗 Click-to-verify link detected:', urlMatch[0]);
                    handleVerificationLink(urlMatch[0]);
                  }
                }
              } catch (e) {
                console.log('⚠️ Chat handler error:', e.message);
              }
            });
            
            // === ERROR HANDLING ===
            bot.on('error', (err) => {
              const msg = err.message || '';
              
              if (msg.includes('ECONNREFUSED') || msg.includes('connect')) {
                console.log('⚠️ Server offline — will retry');
              } else if (msg.includes('timeout') || msg.includes('Timed out')) {
                console.log('⏰ Connection timeout — retrying');
              } else if (msg.includes('Invalid version') || msg.includes('protocol')) {
                console.log('🔄 Version mismatch, trying next version...');
                versionIndex++;
                if (versionIndex < VERSIONS.length) {
                  currentVersion = VERSIONS[versionIndex];
                  console.log('🔄 Trying version:', currentVersion);
                  scheduleReconnect();
                } else {
                  console.log('❌ All versions failed. Giving up.');
                  active = false;
                }
              } else if (!msg.includes('ECONNRESET') && !msg.includes('abort')) {
                console.log('❌ Error:', msg);
              }
            });
            
            // === DISCONNECT HANDLING ===
            bot.on('end', (reason) => {
              console.log('❌', botName, 'disconnected:', reason || 'unknown');
              spawned = false;
              
              if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
              }
              
              if (active && !reconnectTimer && !isDisconnecting) {
                scheduleReconnect();
              }
            });
          }
          
          // === RECONNECT SCHEDULER ===
          function scheduleReconnect() {
            if (!active || reconnectTimer) return;
            
            const delay = RECONNECT_MIN + Math.random() * (RECONNECT_MAX - RECONNECT_MIN);
            console.log('🔄 Reconnecting in', Math.round(delay/1000), 's...');
            
            reconnectTimer = setTimeout(() => {
              reconnectTimer = null;
              if (active) createBot();
            }, delay);
          }
          
          // === RANDOM DISCONNECT SCHEDULER ===
          let disconnectionsDone = 0;
          
          function scheduleRandomDisconnect() {
            if (!active || disconnectionsDone >= disconnectCount) return;
            if (disconnectTimer) {
              clearTimeout(disconnectTimer);
              disconnectTimer = null;
            }
            
            const waitMs = SESSION_MIN + Math.floor(Math.random() * (SESSION_MAX - SESSION_MIN));
            console.log('⏳ Next random disconnect in', Math.round(waitMs/60000), 'min');
            
            disconnectTimer = setTimeout(() => {
              disconnectTimer = null;
              
              if (!active || !bot || disconnectionsDone >= disconnectCount || isDisconnecting) {
                scheduleRandomDisconnect();
                return;
              }
              
              if (Math.random() < 0.70) {
                disconnectionsDone++;
                isDisconnecting = true;
                console.log('🔌 Random disconnect (', disconnectionsDone, '/', disconnectCount, ')');
                
                spawned = false;
                try {
                  if (bot) {
                    bot.end();
                    bot = null;
                  }
                } catch (e) {}
                
                const reconnectDelay = RECONNECT_MIN + Math.random() * (RECONNECT_MAX - RECONNECT_MIN);
                console.log('🔄 Reconnecting in', Math.round(reconnectDelay/1000), 's...');
                
                reconnectTimer = setTimeout(() => {
                  reconnectTimer = null;
                  isDisconnecting = false;
                  if (active) createBot();
                }, reconnectDelay);
              } else {
                console.log('⏭️ Skipped random disconnect.');
              }
              
              scheduleRandomDisconnect();
              
            }, waitMs);
          }
          
          // === START ===
          createBot();
          scheduleRandomDisconnect();
          
          // === SESSION TIMER ===
          sessionTimer = setTimeout(() => {
            console.log('⏰ Session ending. Shutting down...');
            active = false;
            cleanup();
            process.exit(0);
          }, sessionMs);
          
          // === GRACEFUL SHUTDOWN ===
          process.on('SIGINT', () => {
            console.log('🛑 Received SIGINT. Shutting down...');
            active = false;
            cleanup();
            process.exit(0);
          });
          
          process.on('SIGTERM', () => {
            console.log('🛑 Received SIGTERM. Shutting down...');
            active = false;
            cleanup();
            process.exit(0);
          });
          "
