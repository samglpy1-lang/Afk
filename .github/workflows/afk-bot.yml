name: AFK Bot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-js: '18'
      
      - name: Install mineflayer
        run: npm install mineflayer@latest
        
      - name: Run AFK bot
        run: |
          node -e "
          const mineflayer = require('mineflayer');
          
          const bot = mineflayer.createBot({
            host: '${{ secrets.SERVER_IP }}',
            port: 25565,
            username: '${{ secrets.BOT_USERNAME }}',
            version: '1.20.4',
            auth: 'offline',
            checkTimeoutInterval: 300000,
            logErrors: true
          });
          
          // PATCH: Fix keepalive challenge mismatch
          bot.on('login', () => {
            bot._client.on('keep_alive', (packet) => {
              bot._client.write('keep_alive', {
                keepAliveId: packet.keepAliveId
              });
            });
          });
          
          bot.on('spawn', () => {
            console.log('✅ Bot spawned successfully!');
            
            // Anti-AFK: jump, move, and look around
            setInterval(() => {
              // Jump
              bot.setControlState('jump', true);
              setTimeout(() => bot.setControlState('jump', false), 200);
              
              // Random look
              bot.look(Math.random() * Math.PI * 2, 0);
              
              // Move forward/backward occasionally
              if (Math.random() > 0.7) {
                bot.setControlState('forward', true);
                setTimeout(() => bot.setControlState('forward', false), 1000);
              }
            }, 5000);
          });
          
          bot.on('end', (reason) => {
            console.log('❌ Disconnected:', reason);
          });
          
          bot.on('error', (err) => {
            console.log('Error:', err.message);
          });
          
          // Keep bot running for 9.5 minutes (cron runs every 10)
          setTimeout(() => {
            console.log('⏰ Bot shutting down gracefully...');
            process.exit(0);
          }, 570000);
          "
